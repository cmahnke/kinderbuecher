baseURL = "https://xn--kinderbcher-zhb.projektemacher.org/"
theme = ["projektemacher-base"]
title = "Kinderbücher"
locale = "de"
defaultcontentlanguage = "de"
publishDir = "docs"
canonifyURLs = true
disablePathToLower = true
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]
copyright = "<a href=\"https://projektemacher.org\">Projektemacher</a>"
enableGitInfo = true
timeout = "300s"

enableRobotsTXT = true

[params]
    navHome = "Start"
    copyrightYears = "MMXXI"
    productionIIIFURLPrefix="https://static.projektemacher.org/kinderbuecher/"

[params.iiif]
    presentationViewer = "ts/tify.ts"

# navigation
[menu]
    [[menu.main]]
        name = "Zeitstrahl"
        URL = "timeline"
        weight = 1
    [[menu.main]]
        name = "Über"
        URL = "about"
        weight = 2

[markup]
defaultMarkdownHandler = 'goldmark'

[markup.goldmark]
    [markup.goldmark.renderer]
        unsafe= true

    [markup.goldmark.extensions]
        #typographer = true
        attribute = true
        strikethrough = true

  [markup.goldmark.extensions.typographer]
          apostrophe = '&rsquo;'
          disable = false
          ellipsis = '&hellip;'
          emDash = '&mdash;'
          enDash = '&ndash;'
          leftAngleQuote = '&laquo;'
          leftDoubleQuote = '&ldquo;'
          leftSingleQuote = '&lsquo;'
          rightAngleQuote = '&raquo;'
          rightDoubleQuote = '&rdquo;'
          rightSingleQuote = '&rsquo;'

  [markup.goldmark.extensions.extras]
      [markup.goldmark.extensions.extras.insert]
          enable = true
      [markup.goldmark.extensions.extras.mark]
          enable = true
      [markup.goldmark.extensions.extras.subscript]
          enable = true
      [markup.goldmark.extensions.extras.superscript]
          enable = true

[imaging]
#    quality = 95

#[outputs]
#    page = ["HTML", "JSON"]

[mediaTypes]
  [mediaTypes."application/ld+json"]
    suffixes = ["json"]
  [mediaTypes."image/jxl"]
    suffixes = ["jxl"]

[outputFormats]
  [outputFormats.iiif-manifest]
    mediaType = "application/ld+json"
    isPlainText = true
    isHTML = false
    baseName = "manifest"
    notAlternative = true

  [outputFormats.iiif-collection]
    mediaType = "application/ld+json"
    isPlainText = true
    isHTML = false
    baseName = "collection"
    notAlternative = true

[outputs]
  home = ["html", "rss", "iiif-collection"]

[sitemap]
  changeFreq = 'weekly'

[module]
    [[module.mounts]]
        source = "assets/scss"
        target = "assets/scss"

    [[module.mounts]]
        source = "static"
        target = "static"

    [[module.mounts]]
        source = "assets/js"
        target = "assets/js"

    [[module.mounts]]
        source = "assets/ts"
        target = "assets/ts"

    [[module.mounts]]
      source = "node_modules/tify/dist/"
      target = "static/tify"

    [[module.mounts]]
      source = "node_modules/@projektemacher/tify-plugin-musicxml/dist/"
      target = "assets/scss/tify-plugin-musicxml"

    [[module.mounts]]
      source = "node_modules/@projektemacher/tify-plugin-core/"
      target = "assets/scss/tify-plugin-core"

    [[module.mounts]]
      source = "node_modules/vis-timeline/styles"
      target = "assets/css/vis-timeline"

[build]
  writeStats = true

[security]
  [security.http]
    mediaTypes = ['^application/json$', '^application/json;\s?charset=[uU][tT][fF]-8$', '^application/sparql-results\+json;\s?charset=[uU][tT][fF]-8$']

[params.js]
  format = "esm"

[params.robots]
  llmsTXT = true
